# Settings

name: "Эволюция навыков"
description: |-
  Этот мод изменяет развитие навыков, динамически масштабируя скорость роста в зависимости от уровня навыка и его использования.
  В нем также представлены такие функции, как снятие ограничений навыков, автоматическое затухание, ограничения тренировок, динамическая продолжительность и многое другое.

  #c83b1dЧтобы функции ограничения обучения работали правильно#caa560, вам необходимо включить опцию «Тренеры выбирают предлагаемые навыки по базовому значению» в панели запуска.

# - Global group

MainSectionTitle: "ОСНОВНЫЕ НАСТРОЙКИ"
MainSectionDesc: ""

debugMode_name: "Вывод отладочных сообщений на консоль"

# - Skills group

SkillsSectionTitle: "НАСТРОЙКИ НАВЫКОВ"
SkillsSectionDesc: "Настройте функции навыков."

skillLevelBasedScalingRange_name: "Масштабирование усиления в зависимости от уровня навыка"
skillLevelBasedScalingRange_desc: |-
  Измените прирост навыков на коэффициент, масштабируемый по уровню навыка.
  Полезно для предотвращения слишком раннего подавления или для облегчения более низкого повышения навыков, поскольку большинство из них слишком часто терпят неудачу.

  Постоянный коэффициент: установите одинаковые значения «от» и «до».
  Масштабируемый коэффициент: установите меньшее значение «до», коэффициент будет уменьшаться все быстрее и быстрее по мере роста уровня навыка.

  Значение «от» применяется к уровню навыков 0, а значение «до» — к уровню навыков 100.
  Используйте тестовые входные данные для вычисления коэффициентов на любом уровне квалификации.
  Ванильное поведение уже затрудняет повышение навыков высокого уровня, но линейно.
  С этой настройкой прирост навыков снижается все быстрее и быстрее (помимо обычного линейного снижения):
  Низкие навыки практически не затрагиваются, тогда как более высокие навыки развиваются гораздо медленнее.

skillUncapper_name: "Максимальное значение лимита навыка "
skillUncapper_desc: |-
  Ограничьте рост навыков до максимального значения.
  Установите значение 100 для стандартного поведения или 0, чтобы отключить ограничение (неограниченное значение).
  С модом Uncapper это значение имеет значение вместо максимальных значений навыков Uncapper.

perSkillUncapper_name: "Переопределения функции Uncapper для каждого навыка"
perSkillUncapper_desc: |-
  Добавьте максимальные значения для каждого навыка, которые переопределяют глобальное значение Uncapper.

skillDecayRate_name: "Скорость спада навыков"
skillDecayRate_desc: |-
  Установите, насколько быстро навыки ухудшаются с течением времени.

  На прогресс распада также влияют использование навыков, повышение уровня навыков, сон, тренировки, путешествия... дополнительную информацию можно найти в документации.

  #c83b1dWARNING#caa560: Отключение затухания очистит прогресс затухания навыков и потерянные уровни, как только вы возобновите игру.

  Используйте тестовые входные данные, чтобы узнать, через какое время навык снизится с определенного уровня.
  Результат теста не учитывает настройку «Процент модификатора интеллекта скорости затухания навыков».
  Скорость распада перестает увеличиваться выше 100-го уровня навыка.

skillDecayReductionRate_name: "Скорость снижения ухудшения навыков"
skillDecayReductionRate_desc: |-
  Установите, насколько быстро навыки уменьшают свое разрушение при использовании.

  Сокращение выражается как восстановленное время:
  -Медленно: 30 минут.
  -Стандарт: 1 час
  -Быстро: 2 часа

  На снижение затем влияет прирост навыков и масштабирование (пропорционально).

skillDecayIntelligenceFactor_name: "Процент модификатора интеллекта скорости распада навыков"
skillDecayIntelligenceFactor_desc: |-
  Установите, как интеллект меняет скорость распада.

  Каждое очко интеллекта выше 40 снижает скорость распада на этот процент. Интеллект ниже 40 увеличит скорость распада.

  Примеры:
  -Значение 0,5, интеллект 60: скорость затухания изменена на 0,5 *(40 -60) = -10% (медленнее).
  -Значение 1, интеллект 30: скорость распада изменена на 1 *(40 -30) = +10% (быстрее).

capMinorSkillTraining_name: "Ограничение тренировки малых навыков"
capMinorSkillTraining_desc: |-
  В дополнение к стандартному ограничению управляющего атрибута добавьте ограничение на второстепенные навыки:
  Второстепенные навыки не могут быть проработаны выше вашего самого низкого основного навыка.

capMiscSkillTraining_name: "Обучение различным навыкам"
capMiscSkillTraining_desc: |-
  В дополнение к стандартному ограничению управляющего атрибута добавьте ограничение на разные навыки:
  Разные навыки не могут быть проработаны выше вашего самого низкого второстепенного навыка.

scaledTrainingDuration_name: "Масштабированная продолжительность обучения навыкам"
scaledTrainingDuration_desc: |-
  Увеличивайте время тренировки по мере повышения уровня навыков.

  Продолжительность обучения варьируется от часов «от» на уровне навыка 0 до часов «по» на уровне 100.
  Если значение «до» превышает значение «от»:
  -Увеличение соответствует квадрату уровня навыка, практически не затрагивая более низкие навыки.
  -Ускоряется при достижении более высоких навыков
  -Превышает значение «to» после 100 уровня.

  Используйте тестовые входные данные, чтобы получить продолжительность обучения на любом уровне навыков.
  Установите от 2 до 2 для ванильного поведения.

skillIncreaseFromBooks_name: "Разрешить повышение навыков из книг"

carryOverExcessSkillGain_name: "Перенос избыточного полученного навыка"
carryOverExcessSkillGain_desc: |-
  В ванильном Морровинде, когда вы повышаете уровень навыка, прогресс навыка возвращается к 0, даже если прирост навыка был больше, чем требовалось для повышения уровня.

  При этой настройке избыточный прирост навыков переносится на следующий уровень.

# - Time group

TimeSectionTitle: "НАСТРОЙКИ ПРОШЕДШЕГО ВРЕМЕНИ"
TimeSectionDesc: |-
  Контролируйте прошедшее время при использовании трудоемких навыков.

minutesPerPotionCreation_name: "Минуты, потраченные на одно созданное зелье"
minutesPerPotionCreation_desc: |-
 Сколько игровых минут уходит на создание зелий.
  Длительность масштабируется в зависимости от уровня навыка алхимии и варьируется от 1-го значения на уровне 0 до 2-го значения на уровне 100 и выше.
  Например, при алхимии на уровне 50 и диапазоне от 90 до 30 создание зелья занимает 60 минут.

potionMaxRecipeCountBasedTimeReduction_name: "Максимальное сокращение времени на основе количества рецептов"
potionMaxRecipeCountBasedTimeReduction_desc: |-
  Чем больше зелий создано с одним и тем же списком ингредиентов, тем меньше времени потребуется на их создание.
  Установите максимальный процент сокращения времени, достигаемый при сотом созданном зелье.

minutesPerSelfRepair_name: "Минуты, потраченные на самостоятельный ремонт"
minutesPerSelfRepair_desc: |-
  Сколько игровых минут тратится на ремонт одного предмета.
  Длительность масштабируется в зависимости от уровня навыка оружейника: от 1-го значения на уровне 0 до 2-го значения на уровне 100 и выше.
  Например, при уровне оружейника 50 и диапазоне от 15 до 5 один ремонт занимает 10 минут.

minutesPerNPCRepair_name: "Минуты, потраченные на ремонт NPC"
minutesPerNPCRepair_desc: |-
  Сколько игровых минут тратится на то, чтобы кузнец полностью починил предмет.
  Установите 0 для ванильного поведения.

minutesPerSelfEnchanting_name: "Минуты, потраченные на зачарование собственного предмета"
minutesPerSelfEnchanting_desc: |-
  Сколько игровых минут тратится на зачарование предмета.
  Длительность масштабируется в зависимости от уровня умения зачарования: от 1-го значения на уровне 0 до 2-го значения на уровне 100 и выше.
  Например, при зачаровании на уровне 50 и диапазоне от 90 до 30 создание зачарованного предмета занимает 60 минут.

minutesPerNPCEnchanting_name: "Минуты, потраченные на зачарование предмета NPC"
minutesPerNPCEnchanting_desc: |-
  Сколько игровых минут тратится, когда чародей зачаровывает предмет.
  Установите 0 для ванильного поведения.

# - Potions group

PotionsSectionTitle: "НАСТРОЙКИ ЦЕНЫ НА ЗЕЛЬЯ"
PotionsSectionDesc: |-
  Контролируйте цену создаваемых зелий.
  #c83b1dЧтобы контроль цен работал, значение GMST iAlchemyMod должно отличаться от 0.#caa560

potionValueMod_name: "Модификатор цены на зелье"
potionValueMod_desc: |-
  Масштабирует цены на зелья по этому коэффициенту.
  Этот параметр переопределяет стандартное GMST iAlchemyMod, но допускает десятичные значения.
  Установите 0, чтобы производить зелья стоимостью 0 золотых.
  Установите 2 для ванильного поведения.

potionMaxIngredientValuePercent_name: "Соотношение ингредиентов, процент ограниченной цены"
potionMaxIngredientValuePercent_desc: |-
  Ограничьте цену зелья этим процентом от суммы стоимости ингредиента.
  Например, если зелье состоит из 2 ингредиентов стоимостью 10 золотых каждый и установлено значение 200%, максимальная цена зелья составит 2 x 10 x 200% = 40 золотых.
  Установите 0, чтобы отключить ограничение.

potionUsefulEffectsBasedPrice_name: "Соотношение полезных эффектов на основе цены"
potionUsefulEffectsBasedPrice_desc: |-
  Включите эту настройку, чтобы изменить цену в зависимости от соотношения: Количество полезных эффектов /общее количество эффектов.
  Например, если у зелья есть 2 полезных и 2 отрицательных эффекта, цена будет снижена на 50%.
  Полезные эффекты — это безвредные эффекты, за исключением случаев, когда установлен мод TPA Alchemy Redone и игрок устанавливает рецепт как ядовитый, что в данном случае устанавливает вредные эффекты как полезные.

# - Skill Uses Scaled group

SkillUsesScaledSectionTitle: "НАВЫКИ ИСПОЛЬЗУЮТ МАСШТАБИРОВАННЫЕ НАСТРОЙКИ"
SkillUsesScaledSectionDesc: |-
  Прирост многих навыков можно масштабировать в зависимости от шанса на успех, риска, производительности или уровня открытия и сложности.

  Шанс на успех: чем ниже шанс на успех, тем выше выигрыш.
  -Когда игрок успешно использует навык, Skill Evolution оценивает шанс на успех, а затем соответствующим образом изменяет прирост навыка.
  -В то время как OpenMW ограничивает вероятность успеха до 0-100%, Skill Evolution знает реальную базовую ценность и использует ее для своих формул.
  -Из вычислений исключены положительные эффекты (укрепления, святилища, воровские инструменты...). Вы можете улучшить свои достижения с помощью положительных эффектов.
  -Каждый затронутый навык получает специальную точно настроенную шкалу, основанную на его обычном диапазоне шансов на успех.

  Риск: чем рискованнее использование, тем выше прибыль.

  Производительность: чем лучше использование, тем выше прирост

  Открытие: чем новее использование, тем выше выигрыш.

  Сложность: чем сложнее использование, тем выше выигрыш.

  Настройки диапазона позволяют ограничить прибыль.
  Например, если для определенного навыка вы чувствуете, что минимальный прирост в 10 % слишком низок, просто увеличьте это значение, чтобы обеспечить минимальные значения прироста.

skillScalingShowFeats_name: "Показать умения во всплывающих подсказках к навыкам"
skillScalingShowFeats_desc: |-
  Покажите свои лучшие и последние навыки масштабирования навыков во всплывающих подсказках к навыкам в окне статистики персонажа.
  Есть 3 категории подвигов: лучшие за всю историю, лучшие для текущего уровня навыков и последние.
  Для навыков, связанных с игровым объектом, лучшие категории сохраняют только лучшее умение для каждого вида врага, запертого или пойманного объекта, заклинания, рецепта или торговца.

  Отображаемые проценты усиления не учитывают другие функции повышения навыков этого мода, такие как «Масштабирование усиления на основе уровня навыка».
  Кроме того, функции масштабирования, основанные на вероятности успеха навыка, исключают модификаторы (баффы, дебаффы, воровские инструменты...) из формулы: вы не получите лучших или худших результатов от активных заклинаний, хотя успешно использовать ваши навыки может быть проще или сложнее.

skillScalingMaxFeatStats_name: "Максимальная статистика подвигов, отображаемая по категориям"
skillScalingMaxFeatStats_desc: "Сколько навыков отображается для каждой категории навыков (минимум 1, максимум 5)."

magickaBasedSkillScaling_name: "Масштабирование навыков на основе магии"
magickaBasedSkillScaling_desc: |-
  Масштабируйте каждый навык, основанный на магии, в зависимости от шанса произнесения заклинания (исключая модификаторы) и процента общей магии, потраченной на заклинание для заклинаний с низкой стоимостью.
  Включение этой функции отключит развитие навыков, основанное на магии (см. раздел «Магия»).

  Масштабирование является линейным для вероятности применения ниже 100% и нелинейным выше. Вот некоторые типичные значения усиления:
  -0% шанс -> 300% выигрыш
  -Шанс 50% -> выигрыш 200%.
  -100% шанс -> 100% выигрыш
  -Шанс 150% -> выигрыш 94%.
  -Шанс 175% -> выигрыш 68%.
  -Шанс 200% -> выигрыш 0% (10% при минимальном значении по умолчанию)

  Когда потраченная магия ниже 10% от общего количества вашей магии, прирост постепенно уменьшается в зависимости от этого процента.

weaponSkillScaling_name: "Масштабирование навыков владения оружием"
weaponSkillScaling_desc: |-
  Масштабируйте каждый навык, основанный на оружии, в зависимости от шанса попадания (исключая модификаторы игрока и врага).
  Фактор скорости оружия не является частью этого масштабирования: более быстрое оружие всегда дает меньший выигрыш, даже если эта функция отключена.

  Масштабирование нелинейное, вот некоторые типичные значения усиления:
  -0% шанс -> 200% выигрыш
  -Шанс 25% -> выигрыш 152%.
  -Шанс 50% -> выигрыш 117%.
  -Шанс 63% -> выигрыш 100%.
  -100% шанс -> 55% выигрыша
  -Шанс 125% -> выигрыш 27%.
  -Шанс 150% -> выигрыш 0% (10% при минимальном значении по умолчанию)

armorSkillScaling_name: "Масштабирование навыка брони"
armorSkillScaling_desc: |-
  Масштабируйте каждый навык, основанный на доспехах, с учетом риска умереть от физического удара.
  Фактор риска основан на получаемом физическом уроне (без учета снижения брони) сверх полного здоровья игрока.

  Масштабирование линейное, вот некоторые типичные значения усиления:
  -100% урона -> 400% усиления
  -75% урона -> 300% усиления
  -50% урона -> 200% усиления
  -25% урона -> 100% усиления
  -10% урона -> 40% усиления
  -5% урона -> 20% усиления

blockSkillScaling_name: "Масштабирование навыка блока"
blockSkillScaling_desc: |-
  Масштабируйте навык блока, чтобы избежать риска умереть от физического удара.
  Фактор риска основан на предотвращенном физическом уроне (исключая снижение брони) при полном здоровье игрока.
  Заблокированный удар, наносящий только урон усталости, учитывается наполовину, исходя из полной усталости игрока.

  Масштабирование линейное, вот некоторые типичные значения усиления:
  -100% урона -> 400% усиления
  -75% урона -> 300% усиления
  -50% урона -> 200% усиления
  -25% урона -> 100% усиления
  -10% урона -> 40% усиления
  -5% урона -> 20% усиления

securitySkillScaling_name: "Масштабирование навыков безопасности"
securitySkillScaling_desc: |-
  Масштабируйте навык безопасности в зависимости от шанса разблокировки или обезвреживания (исключая модификаторы и качество инструмента).

  Масштабирование линейное, вот некоторые типичные значения усиления:
  -0% шанс -> 200% выигрыш
  -Шанс 25% -> выигрыш 150%.
  -Шанс 50% -> выигрыш 100%.
  -Шанс 75% -> выигрыш 50%.
  -100% шанс -> 0% выигрыша (10% при минимальном значении по умолчанию)

acrobaticsSkillScaling_name: "Масштабирование навыков акробатики"
acrobaticsSkillScaling_desc: |-
  Масштабируйте навыки акробатики с учетом риска и производительности прыжка, риска падения и риска уклонения.

  Риск прыжка и факторы производительности зависят от глубины и длины ямы под игроком, а также от рисков, окружающих посадочную платформу.
  Также существует временной фактор, ограничивающий прирост при быстрых сериях прыжков (время между прыжками).
  Риск падения линейно зависит от ущерба от падения и колеблется от 0 до 200%.
  Риск уклонения линейно зависит от предотвращенного урона от удара и шанса попадания противника (исключая модификаторы) и находится в диапазоне от 0 до 400%.

  Вот некоторые типичные значения усиления прыжка:
  -Полный вертикальный прыжок или прыжок в длину на ровной поверхности -> прирост 10%.
  -Прыжок в длину через неглубокую яму -> прирост около 50-100%.
  -Прыжок в длину через глубокую пропасть -> выигрыш до +100%.
  -Приземление на возвышенную и небольшую платформу -> выигрыш до +200%.
  -Быстрые прыжки на подъеме -> прирост 0-10%.
  -Прыжок через воду -> усиление уменьшено вдвое.
  -Перепрыгнуть через лаву -> усиление до +50%.
  -Использование медленного падения во время прыжка -> уменьшено усиление.
  -Использование левитации во время прыжка -> нет усиления
  -Уклонение от слабого или неточного удара в ближнем бою -> усиление ~0-100%.
  -Уклонение от одного или нескольких сильных ударов в ближнем бою -> выигрыш до 400%.

athleticsSkillScaling_name: "Масштабирование навыков легкой атлетики"
athleticsSkillScaling_desc: |-
  Масштабируйте навыки легкой атлетики по показателям выносливости.
  Чем дольше пробег, тем выше прирост в секунду (до 150%).
  Чем выше процент обременения, тем выше прирост в секунду (до 50%).

  Когда игрок идет, бонус усиления уменьшается с той же скоростью, с которой он увеличивался во время бега.
  Когда игрок останавливается, бонус усиления уменьшается в два раза быстрее.
  Когда скорость бега снижается из-за препятствующих элементов окружающей среды, прирост уменьшается пропорционально снижению скорости, но бонус прироста не теряется и будет применен снова, когда путь будет расчищен.

  Масштабирование является нелинейным по времени и линейным по обременению.
  Вот некоторые типичные значения усиления:
  -бег 4,5 секунды, нагрузка 0% -> прирост 50%
  -бег 0,5 секунды, нагрузка 50% -> прирост 50%
  -бег 36 секунд, нагрузка 0% -> прирост 100%
  -бег 15 секунд, нагрузка 50% -> прирост 100%
  -бег 120 секунд, нагрузка 0% -> прирост 150%
  -бег 70 секунд, нагрузка 50% -> прирост 150%
  -бег 120 секунд, нагрузка 50% -> прирост 175%
  -бег 120 секунд, 100% нагрузка -> 200% прирост
  -бег перед стеной -> прирост 0% (10% при минимальном значении по умолчанию)

alchemySkillScaling_name: "Увеличение навыков алхимии"
alchemySkillScaling_desc: |-
  Масштабируйте навыки алхимии в зависимости от открытия и сложности рецептов.
  Чем больше игрок создает зелий по одному и тому же рецепту, тем ниже выигрыш.
  Чем больше полезных эффектов в полученном зелье, тем выше выигрыш.
  Полезные эффекты — это безвредные эффекты, за исключением случаев, когда установлен мод TPA Alchemy Redone и игрок устанавливает рецепт как ядовитый, что в данном случае устанавливает вредные эффекты как полезные.

  Неэффективные ингредиенты игнорируются.
  Масштабирование нелинейное, вот некоторые типичные значения усиления для одного и того же рецепта:
  -1-е зелье с 0 полезными эффектами -> усиление 50%.
  -1-е зелье с 1 полезным эффектом -> усиление 100%
  -29-е зелье с 1 полезным эффектом -> усиление 50%
  -100-е зелье с 1 полезным эффектом -> прирост 0% (10% при минимальном значении по умолчанию)
  -1-е зелье с 2 полезными эффектами -> усиление 150%
  -1-е зелье с 4 полезными эффектами -> усиление 250%
  -36-е зелье с 4 полезными эффектами -> усиление 100%.

