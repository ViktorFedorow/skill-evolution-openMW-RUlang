refundEnabled_name: "Включить возврат"
refundEnabled_desc: |-
  Возвращать ли ману или нет, в зависимости от уровня навыков школы.
  Формула суммы возврата = Стоимость заклинания * (множитель возврата / 5) * (1 - POW(0.5, (Навык - Начало возврата) / 100))
refundMult_name: "Множитель возврата магии"
refundMult_desc: "Рекомендуется значение по умолчанию 4."
refundStart_name: "Начальное значение навыка возврата маны"
refundStart_desc: "Уровень навыка, при котором начинается возврат заклинаний."

mbspEnabled_name: "Включить MBSP"
mbspEnabled_desc: |-
  Включить развитие навыков на основе магии, в зависимости от стоимости заклинаний.
  Эта функция обеспечивает прогресс магических навыков в зависимости от количества магии, затраченной на данное заклинание (а не фиксированное количество в ванильной игре).
  Включение этой функции отключит предпочтительную функцию автора «Масштабирование навыков на основе магии» (см. раздел «Масштабирование использования навыков»).

mbspRate_name: "Ставка опыта MBSP"
mbspRate_desc: "Количество магии за применение, необходимое для достижения ванильного уровня прокачки."

